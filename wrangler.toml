# chatmany — Cloudflare Worker config
# After cloning: `wrangler d1 create chatmany`, paste the returned database_id below,
# then `npm run db:migrate:remote`. Secrets are set with `wrangler secret put` (see .env.example).
#
# ⚠️ WHEN UPDATING TO A NEWER VERSION: MIGRATE THE DATABASE BEFORE YOU DEPLOY.
#      npm run db:migrate:remote     # first, and check it succeeded
#      npm run deploy                # only then
#    Never the other way round. New code can expect a column your live database does not have yet,
#    and that failure is silent rather than loud: someone who comments still receives their opening
#    DM, but no record of them is written, so when they tap the button nothing happens — forever,
#    with no error anywhere. Migrating first is always safe, because the version currently running
#    simply ignores anything new. See "Updating an existing install" in the README.

name = "chatmany"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]

# Cron triggers (all free tier).
#  - every minute: poll comments + inbound messages for active campaigns
#  - daily 03:00 UTC: refresh the long-lived Instagram token if it is due
[triggers]
crons = ["* * * * *", "0 3 * * *"]

# D1 database. Replace database_id with the id printed by `wrangler d1 create chatmany`.
[[d1_databases]]
binding = "DB"
database_name = "chatmany"
database_id = "REPLACE-WITH-THE-ID-FROM-wrangler-d1-create"
migrations_dir = "schema"

# Web UI (Section 7A). Static files in ./public are served automatically; the Worker handles
# /api/*, /auth/*, and /webhook, and falls back to index.html for client-side routes (SPA).
[assets]
directory = "./public"
binding = "ASSETS"

[vars]
# Public, non-secret configuration. Secrets (APP_SECRET, OWNER_TOKEN) go via `wrangler secret put`.
GRAPH_VERSION = "v23.0"
# LEAVE THIS AS "polling". It is the default, and it is almost certainly what you want.
#
# MODE does NOT decide whether you get instant delivery. It sets the CRON CADENCE, nothing else:
#   "polling"  -> the cron polls every POLL_INTERVAL_SECONDS (below)
#   "webhook"  -> the cron drops to the much slower WEBHOOK_RECONCILE_SECONDS sweep
#
# Pushed webhook events are verified and processed the moment they arrive under EITHER setting.
# So instant delivery is not something you switch on here — it comes from registering a callback
# URL with Meta, which is step 3.5 of the README's setup. Part 6 is how you confirm it took.
#
# The combination you want is this one: MODE = "polling" AND a registered callback URL. Push makes
# delivery instant; the 60-second poll sits underneath and catches anything a delivery drops.
#
# Setting "webhook" before push is confirmed working is the classic way to break this: no events
# arrive, the only thing still running is the 15-minute sweep, and every DM looks ~15 minutes late
# as if chatmany were broken. Even once push IS working, "webhook" only makes your safety net 15x
# slower — if push ever fails you wait 15 minutes to notice instead of 60 seconds.
MODE = "polling"
# Seconds between comment/message polls. The cron can only fire once a minute, and a tick is
# skipped unless this many seconds have elapsed — so 90 here actually meant polling every 120s
# (the 60s tick was refused, the next chance was 120s). 60 makes every tick count, which is the
# fastest polling can go: worst case ~60s from comment to DM instead of ~120s.
#
# This is the SAFETY NET, not your delivery path. If you completed step 3.5 of the setup, Meta
# pushes each comment to you and the DM goes out in a second or two; this poll only catches what a
# push delivery drops. 60s is polling's floor — it is what you fall back to, and what you get if
# you skipped 3.5. Either way, LEAVE MODE as "polling".
POLL_INTERVAL_SECONDS = "60"
# Only used when MODE = "webhook": how often to run a slow reconciliation poll that catches anything
# a webhook delivery missed (Meta gives up after a few retries; a redeploy or a blip loses those leads with
# nothing to notice it). Safe to run alongside push — the engine's idempotency ledgers mean an
# already-handled comment is recognised and skipped, never re-sent. Set to "off" for pure push.
WEBHOOK_RECONCILE_SECONDS = "900"
# Redirect URI registered in your Meta app. Must match exactly: https://<your-worker>/auth/callback
# You MUST change this before deploying — the placeholder is not a working URL.
REDIRECT_URI = "https://REPLACE-WITH-YOUR-WORKER-URL.workers.dev/auth/callback"
